name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crates:
    if: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish clawdb
        run: cargo publish -p clawdb --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      - name: Wait for index update (clawdb)
        run: sleep 30

      - name: Publish clawdb-server
        run: cargo publish -p clawdb-server --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      - name: Wait for index update (clawdb-server)
        run: sleep 30

      - name: Publish clawdb-cli
        run: cargo publish -p clawdb-cli --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  publish-crates-skipped:
    if: ${{ secrets.CARGO_REGISTRY_TOKEN == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip publish (no token)
        run: echo "CARGO_REGISTRY_TOKEN is not set; skipping crates publish jobs."

  build-binaries:
    needs: publish-crates
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross
        if: runner.os == 'Linux'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Setup Rust target
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build clawdb-cli
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cross build --release --target ${{ matrix.target }} -p clawdb-cli
          else
            cargo build --release --target ${{ matrix.target }} -p clawdb-cli
          fi
        shell: bash

      - name: Package artifact (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/clawdb dist/
          tar -czf clawdb-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C dist clawdb
        shell: bash

      - name: Package artifact (windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/${{ matrix.target }}/release/clawdb.exe dist/
          Compress-Archive -Path dist/clawdb.exe -DestinationPath clawdb-${{ github.ref_name }}-${{ matrix.target }}.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawdb-${{ matrix.target }}
          path: |
            clawdb-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            clawdb-${{ github.ref_name }}-${{ matrix.target }}.zip

  release:
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## Installation

          ```bash
          cargo install clawdb-cli
          cargo install clawdb-server
          ```

          ## Docker

          ```bash
          docker pull ghcr.io/claw-db/clawdb:${GITHUB_REF_NAME}
          ```
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
          body_path: RELEASE_NOTES.md
