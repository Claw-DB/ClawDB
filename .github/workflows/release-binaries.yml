name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to build"
        required: true
        default: "main"
      tag_name:
        description: "Release tag to create/update (for example: v0.1.8-rc2)"
        required: true
      prerelease:
        description: "Mark release as pre-release"
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protobuf compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc -y

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }} -p clawdb-server
          cargo build --release --target ${{ matrix.target }} -p clawdb-cli
        shell: bash

      - name: Package
        shell: bash
        run: |
          BINARY_DIR="target/${{ matrix.target }}/release"
          EXT="${{ matrix.ext }}"
          tar -czf "clawdb-${{ matrix.target }}.tar.gz" \
            -C "$BINARY_DIR" \
            "clawdb-server${EXT}" \
            "clawdb${EXT}"

      - name: Compute checksum
        shell: bash
        run: |
          sha256sum "clawdb-${{ matrix.target }}.tar.gz" \
            > "checksums-${{ matrix.target }}.txt" 2>/dev/null || \
          shasum -a 256 "clawdb-${{ matrix.target }}.tar.gz" \
            > "checksums-${{ matrix.target }}.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawdb-${{ matrix.target }}
          path: |
            clawdb-${{ matrix.target }}.tar.gz
            checksums-${{ matrix.target }}.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Merge checksums
        run: cat checksums-*.txt | sort -u > checksums-final.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: ${{ inputs.ref }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            clawdb-*.tar.gz
            checksums-final.txt
          generate_release_notes: true
